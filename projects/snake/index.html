<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"> <!-- 声明 UTF-8 编码，防止中文乱码 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇（第 8 课参考项目）</title>
    <style>
        /* 单文件项目：CSS 直接写在 style 标签里 */
        body {
            font-family: "Microsoft YaHei", sans-serif;
            text-align: center;
            background: #1e272e; /* 深色背景，更有游戏感 */
            color: #fff;
            padding-top: 24px;
        }

        #score {
            font-size: 24px;
            margin-bottom: 12px;
        }

        /* 游戏画布 */
        #board {
            background: #0a1218;
            border: 4px solid #4a6cf7; /* 蓝色边框 */
            border-radius: 8px;
        }

        .tip {
            color: #888;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>🐍 贪吃蛇</h1>
    <div id="score">得分：0</div>

    <!-- canvas 是"画布"，JS 在上面一格一格画蛇和食物 -->
    <canvas id="board" width="400" height="400"></canvas>
    <p class="tip">方向键控制移动 · 按空格键重新开始</p>

    <script>
        // ============================================
        // 贪吃蛇游戏逻辑（单文件版，供第 8 课参考）
        // ============================================

        // ---------- 可调参数 ----------
        const GRID = 20;          // 地图是 20×20 的格子
        const CELL = 400 / GRID;  // 每格 20 像素
        const SPEED = 150;        // 蛇前进的间隔（毫秒），越小越快 【改这里调难度】

        // ---------- 抓取画布 ----------
        const canvas = document.getElementById("board");
        const ctx = canvas.getContext("2d"); // ctx 是"画笔"
        const scoreElement = document.getElementById("score");

        // ---------- 游戏状态 ----------
        let snake;      // 蛇：一个数组，每个元素是 {x, y} 格子坐标，第一个元素是蛇头
        let food;       // 食物的格子坐标
        let dx, dy;     // 蛇的移动方向（横向增量、纵向增量）
        let score;      // 得分
        let gameLoop;   // 主循环定时器
        let alive;      // 蛇是否还活着

        // 初始化 / 重置游戏
        function init() {
            snake = [{ x: 10, y: 10 }]; // 蛇从地图中央出发，初始只有 1 节
            dx = 1; dy = 0;             // 初始向右走
            score = 0;
            alive = true;
            scoreElement.textContent = "得分：0";
            placeFood(); // 放第一个食物

            // 先清掉旧定时器再开新的，防止越玩越快
            clearInterval(gameLoop);
            gameLoop = setInterval(update, SPEED); // 每 SPEED 毫秒走一步
        }

        // 随机放食物（不能出现在蛇身上）
        function placeFood() {
            while (true) {
                const fx = Math.floor(Math.random() * GRID); // 0~19 随机列
                const fy = Math.floor(Math.random() * GRID); // 0~19 随机行
                // some()：检查蛇的每一节，是否占了这个格子
                const onSnake = snake.some(function (seg) {
                    return seg.x === fx && seg.y === fy;
                });
                if (!onSnake) {
                    food = { x: fx, y: fy };
                    return; // 找到合法位置，结束函数
                }
            }
        }

        // 每走一步：移动蛇、判断吃食/死亡、重画画面
        function update() {
            if (!alive) return; // 死了就不走了

            // 计算新蛇头的位置
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 撞墙判断：超出地图边界
            const hitWall = head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID;
            // 撞自己判断：新蛇头和身体某一节重合
            const hitSelf = snake.some(function (seg) {
                return seg.x === head.x && seg.y === head.y;
            });
            if (hitWall || hitSelf) {
                alive = false;
                draw(); // 最后再画一次，展示"遗照"
                setTimeout(function () {
                    alert("💀 游戏结束！你的得分：" + score + "，按空格重新开始");
                }, 50);
                return;
            }

            // 蛇头前进：把新头加到数组最前面
            snake.unshift(head);

            // 吃到食物：加分、放新食物，蛇尾不缩（变长）
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = "得分：" + score;
                placeFood();
            } else {
                snake.pop(); // 没吃到：去掉尾巴，保持长度不变
            }

            draw();
        }

        // 画整个画面
        function draw() {
            // 清空画布（涂成背景色）
            ctx.fillStyle = "#0a1218";
            ctx.fillRect(0, 0, 400, 400);

            // 画食物（红色圆点）
            ctx.fillStyle = "#e74c3c";
            ctx.beginPath();
            ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // 画蛇（头是亮绿色，身体是深绿色）
            snake.forEach(function (seg, i) {
                ctx.fillStyle = i === 0 ? "#7bed9f" : "#2ecc71";
                ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
            });
        }

        // 监听键盘：方向键改方向，空格重新开始
        document.addEventListener("keydown", function (event) {
            // 禁止 180 度掉头（比如正在向右时不能直接向左）
            if (event.key === "ArrowUp" && dy !== 1)    { dx = 0; dy = -1; }
            if (event.key === "ArrowDown" && dy !== -1) { dx = 0; dy = 1; }
            if (event.key === "ArrowLeft" && dx !== 1)  { dx = -1; dy = 0; }
            if (event.key === "ArrowRight" && dx !== -1){ dx = 1; dy = 0; }
            if (event.key === " " && !alive) { init(); } // 死了之后按空格重开
        });

        init(); // 页面加载后自动开始第一局
    </script>
</body>
</html>
